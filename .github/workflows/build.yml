name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CarTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarTube-apk
          path: CarTube.apk

      # Keeps a "latest" release with the newest APK so it can be downloaded
      # straight from the phone without logging in to GitHub.
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CarTube.apk \
            --title "CarTube (senaste bygget)" \
            --notes "Byggd från ${GITHUB_SHA::7}. Ladda ner CarTube.apk på telefonen och installera." \
            --target "$GITHUB_SHA"
