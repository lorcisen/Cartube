name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.CARTUBE_SIGNING != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The signing key lives only in the repository's secrets. Without it (for example
      # in pull requests from forks) the APK is signed with the public development key
      # and is not published.
      # The CARTUBE_SIGNING secret holds the whole key file handed out at setup: a line with
      # the password, then one long line with the base64-encoded keystore.
      - name: Restore signing key
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          CARTUBE_SIGNING: ${{ secrets.CARTUBE_SIGNING }}
        run: |
          lines=$(printf '%s\n' "$CARTUBE_SIGNING" | tr -d '\r' | grep -v '^===' | grep -v '^CarTube' | grep -v '^[[:space:]]*$')
          password=$(printf '%s\n' "$lines" | head -1 | tr -d ' ')
          printf '%s\n' "$lines" | tail -n +2 | tr -d ' \n' | base64 -d > app/release.keystore
          echo "::add-mask::$password"
          echo "SIGNING_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build
        run: |
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|ERROR:" build.log | head -40

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CarTube.apk

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs CarTube.apk | grep -E "SHA-1|SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: CarTube-apk
          path: CarTube.apk

      # Keeps a "latest" release with the newest APK so it can be downloaded
      # straight from the phone without logging in to GitHub.
      - name: Publish latest release
        if: env.HAS_SIGNING_KEY == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CarTube.apk \
            --title "CarTube (senaste bygget)" \
            --notes "Byggd från ${GITHUB_SHA::7}. Ladda ner CarTube.apk på telefonen och installera." \
            --target "$GITHUB_SHA"
